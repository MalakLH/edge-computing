name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform format and validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare CloudFront public key
        env:
          CLOUDFRONT_PUBLIC_KEY: ${{ secrets.CLOUDFRONT_PUBLIC_KEY }}
        run: |
          if [ -z "$CLOUDFRONT_PUBLIC_KEY" ]; then
            echo "Missing CLOUDFRONT_PUBLIC_KEY GitHub secret"
            exit 1
          fi

          mkdir -p keys
          printf '%s\n' "$CLOUDFRONT_PUBLIC_KEY" > keys/public_key.pem

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Remove stale Terraform cache
        run: rm -rf terraform/.terraform

      - name: Initialize Terraform without a backend
        run: terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform configuration
        run: terraform -chdir=terraform validate -no-color

  python:
    name: Python syntax and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install boto3 Pillow requests python-dotenv cryptography pytest

      - name: Compile Python source
        run: python -m compileall -q lambda scripts tests

      - name: Run pytest when actual tests exist
        shell: bash
        run: |
          if grep -R -E '^[[:space:]]*(async[[:space:]]+)?def[[:space:]]+test_' tests \
            --include='test_*.py' \
            --include='*_test.py' >/dev/null 2>&1; then
            PYTHONPATH=lambda/image python -m pytest -q tests
          else
            echo "No pytest test functions found. Skipping pytest."
          fi